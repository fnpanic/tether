# Client-side TLS layer for the load generator (same for every candidate): plain HTTP/WebSocket in
# on 127.0.0.1:28081, TLS 1.3 out to the front under test on localhost:28443. HAProxy frees idle
# buffers, so 30 000 idle WebSockets cost the PC far less than a second Caddy.
global
	maxconn 400000
	nbthread 4
	ssl-server-verify none
defaults
	mode http
	timeout connect 10s
	timeout client 1h
	timeout server 1h
	timeout tunnel 1h
frontend c
	bind 127.0.0.1:28081 backlog 16384
	http-request set-header Host localhost
	default_backend f
backend f
	http-reuse safe
	server f 127.0.0.1:28443 ssl verify none sni str(localhost) alpn http/1.1 maxconn 400000
