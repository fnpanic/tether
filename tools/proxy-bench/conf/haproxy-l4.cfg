# Bench front for the "no HTTP proxy on the hot path" estimate: HAProxy in TCP mode terminates TLS
# and copies bytes to hbbr's WebSocket port (no HTTP parsing). Valid for the relay test only.
global
	maxconn 400000
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
defaults
	mode tcp
	timeout connect 5s
	timeout client 1h
	timeout server 1h
frontend tls
	bind 127.0.0.1:28443 ssl crt @W@/tls/localhost.pem alpn http/1.1 backlog 16384
	default_backend hbbr
backend hbbr
	server s 127.0.0.1:25119
