# Bench front: HAProxy, hot routes of the production config (server/haproxy/haproxy.cfg).
global
	maxconn 400000
	tune.bufsize.large 524288
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
	stats socket @W@/haproxy.sock mode 600 level admin
defaults
	mode http
	timeout connect 5s
	timeout client 30s
	timeout server 30s
	timeout http-request 10s
	timeout tunnel 1h
frontend metrics
	bind 127.0.0.1:28125
	http-request use-service prometheus-exporter if { path /metrics }
frontend https
	bind 127.0.0.1:28443 ssl crt @W@/tls/localhost.pem alpn h2,http/1.1 backlog 16384
	http-request set-header X-Real-IP %[src]
	http-request set-header X-Forwarded-For %[src]
	http-request set-header X-Forwarded-Proto https
	use_backend hbbs_ws if { path /ws/id }
	use_backend hbbr_ws if { path /ws/relay }
	use_backend api if { path_beg /api/ }
	default_backend files
backend hbbs_ws
	server s 127.0.0.1:25118
backend hbbr_ws
	server s 127.0.0.1:25119
backend api
	http-request wait-for-body time 10s at-least 512k use-large-buffer
	server s 127.0.0.1:25120
backend files
	# HAProxy cannot serve files: a local nginx/Caddy does (here: the bench nginx on 28126).
	server s 127.0.0.1:28126
