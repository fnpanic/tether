# Bench front: nginx, hot routes of the production config (server/nginx/nginx.conf).
worker_processes @WORKERS@;
worker_rlimit_nofile 1048576;
pid @W@/nginx.pid;
error_log @W@/nginx-error.log warn;
events { worker_connections 32768; }
http {
	types { application/json json; text/html html; application/vnd.microsoft.portable-executable exe; }
	default_type application/octet-stream;
	server_tokens off;
	access_log off;
	sendfile on;
	tcp_nopush on;
	client_body_buffer_size 512k;
	client_max_body_size 256m;
	client_body_temp_path @W@/ngx/body;
	proxy_temp_path @W@/ngx/proxy;
	fastcgi_temp_path @W@/ngx/fcgi;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_session_cache shared:SSL:20m;
	ssl_session_tickets off;
	map $http_upgrade $connection_upgrade { default upgrade; "" ""; }
	upstream api { server 127.0.0.1:25120; keepalive 32; }
	server {
		listen 127.0.0.1:28443 ssl backlog=16384 reuseport;
		listen 127.0.0.1:28126;
		http2 on;
		ssl_certificate @W@/tls/localhost.crt;
		ssl_certificate_key @W@/tls/localhost.key;
		proxy_http_version 1.1;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		# All here: a proxy_set_header in a location would drop the server-level ones.
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		location = /ws/id {
			proxy_pass http://127.0.0.1:25118;
			proxy_read_timeout 1h; proxy_send_timeout 1h;
			proxy_buffering off;
		}
		location = /ws/relay {
			proxy_pass http://127.0.0.1:25119;
			proxy_read_timeout 1h; proxy_send_timeout 1h;
			proxy_buffering off;
		}
		location /api/ {
			proxy_pass http://api;
		}
		location /download/ { root @W@/api; }
		location / { return 200 "Tether relay"; }
	}
}
