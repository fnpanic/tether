# Re-run the macOS smoke test on the apps an earlier desktop run built (minutes, no rebuild).
name: mac-smoke
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "desktop run id with the tether-macos-universal artifact", required: true }
permissions: { contents: read, actions: read }
jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tether-macos-universal, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}", path: dist/macos }
      - run: EXPECT_SIGNED=1 bash scripts/smoke-macos.sh dist/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tether-macos-smoke, path: dist/smoke/* }
