name: server
on:
  push:
    branches: [main]
    paths: [server/**, vendor/**, crates/**, patches/**, scripts/**, tools/macbuild/**, tools/monitor-publish/**, tools/load/**, apps/manage/src-tauri/src/keys.rs, .github/workflows/server.yml]
  # Pull requests that touch the relay, the device-status tools or the shared crates.
  pull_request:
    paths: [server/**, crates/**, scripts/**, tools/monitor-publish/**, tools/load/**, apps/manage/src-tauri/src/keys.rs, .github/workflows/server.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get install -y musl-tools
      - run: scripts/bootstrap.sh
      # The same static musl binaries as the deploy bundle, and the relay test suite.
      - name: Build hbbs, hbbr, tether-api
        run: bash scripts/build-relay.sh "$RUNNER_TEMP/relay"
      - name: Test rustdesk-server, tether-api, backup relay failover
        run: bash scripts/test-relay.sh "$RUNNER_TEMP/relay"
      - name: Test tether-trust
        working-directory: crates/tether-trust
        run: cargo test --release
      # The device-status admin tool: unit tests, then end to end against the tether-api built above.
      - name: Test tools/monitor-publish
        working-directory: tools/monitor-publish
        run: |
          cargo test --release
          TETHER_API_BIN="$RUNNER_TEMP/relay/bin/tether-api" cargo test --release --test e2e -- --ignored
      - name: Build the status load generator (tools/load/status-run.sh runs it by hand)
        run: cargo build --release --manifest-path tools/load/status-load/Cargo.toml
      # The Mac build runner and its client (stdlib + ssh-keygen, no network).
      - name: Test tools/macbuild
        run: python3 -m unittest discover -s tools/macbuild
      - name: Package
        run: |
          d=dist/tether-server
          mkdir -p $d/bin
          cp "$RUNNER_TEMP"/relay/bin/{hbbs,hbbr,tether-api} $d/bin/
          cp -r server/install.sh server/systemd server/caddy server/nginx server/sysctl $d/
          tar -C dist -czf tether-server-linux-x86_64.tar.gz tether-server
      - uses: actions/upload-artifact@v4
        with: { name: tether-server-linux-x86_64, path: tether-server-linux-x86_64.tar.gz }
      - name: Docker image
        run: docker build -f server/Dockerfile -t tether-server .
