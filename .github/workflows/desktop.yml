name: desktop
on:
  # Docs-only changes don't build (macOS minutes count 10x on the free plan).
  push: { branches: [main], paths-ignore: ["docs/**", "**.md"] }
  pull_request: { paths-ignore: ["docs/**", "**.md"] }
  workflow_dispatch:

env:
  TETHER_SERVER: ${{ secrets.TETHER_SERVER }}
  TETHER_PUB_KEY: ${{ secrets.TETHER_PUB_KEY }}
  TETHER_ADMIN_PUB_KEY: ${{ secrets.TETHER_ADMIN_PUB_KEY }}
  TETHER_UPDATER_PUB_KEY: ${{ secrets.TETHER_UPDATER_PUB_KEY }}
  # Only whether the signing secrets exist (for `if:`); the secrets themselves go to the signing steps alone.
  HAVE_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
  HAVE_WINDOWS_P12: ${{ secrets.WINDOWS_SIGNING_P12 != '' }}

permissions:
  contents: read

jobs:
  build:
    # actions: read is for SignPath's action, which fetches the uploaded artifact with the job token.
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc, triplet: x64-windows-static }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - name: Fetch pinned sources and apply patches
        shell: bash
        run: bash scripts/bootstrap.sh
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with: { vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d }
      - name: Native deps
        shell: bash
        env: { VCPKG_DEFAULT_HOST_TRIPLET: "${{ matrix.triplet }}" }
        run: |
          cd vendor/rustdesk
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.triplet }} --x-install-root="$VCPKG_ROOT/installed"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/quick/src-tauri
      - name: UI checks
        working-directory: apps/desktop
        run: npm ci && npx tsc --noEmit && npx vitest run
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: cargo test --target ${{ matrix.target }}
      - name: Rust tests (TetherQS)
        working-directory: apps/quick/src-tauri
        shell: bash
        run: cargo test --target ${{ matrix.target }}
      - name: Bundle
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis
      # Free self-signed Authenticode (scripts/make-windows-cert.ps1), mirroring the macOS cert.
      # Gives a stable publisher identity and full trust on fleets that deploy the .cer (GPO/Intune);
      # inert without the secret. Superseded by the SignPath step below once that is approved.
      - name: Sign (self-signed)
        if: env.HAVE_WINDOWS_P12 == 'true' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          P12: ${{ secrets.WINDOWS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $dir = "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cs.pfx", [Convert]::FromBase64String($env:P12))
          $c = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new("$env:RUNNER_TEMP\cs.pfx", $env:P12_PASSWORD)
          Get-ChildItem "$dir/*.exe" | ForEach-Object {
            $r = Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $c -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
            if ($r.Status -ne 'Valid') { throw "signing $($_.Name): $($r.Status) $($r.StatusMessage)" }
            "signed $($_.Name)"
          }
          Remove-Item "$env:RUNNER_TEMP\cs.pfx" -Force
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: tether-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
      # Free Authenticode signing by SignPath Foundation (docs/code-signing.md). Inert until the
      # project is accepted and the secret SIGNPATH_API_TOKEN and the repo variables exist.
      - name: Sign (SignPath)
        if: env.HAVE_SIGNPATH == 'true' && github.event_name != 'pull_request'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tether
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          output-artifact-directory: signed
      - if: hashFiles('signed/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tether-${{ matrix.target }}-signed
          path: signed/

  # Tether Manage: its own tests only (no vendor sources, no bundle; it is built on the maintainer's PC).
  manage:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/manage/package-lock.json }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/manage/src-tauri }
      - name: UI tests
        working-directory: apps/manage
        run: npm ci && npm test
      - name: Rust tests
        working-directory: apps/manage/src-tauri
        run: cargo test

  # Unsigned universal build (Apple silicon + Intel), the same script as on a developer Mac.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/quick/src-tauri
      # Stable signature: macOS keeps Screen Recording / Accessibility across updates only when every
      # build is signed with the same certificate (ad-hoc signatures differ per build). A free
      # self-signed code-signing certificate is enough (docs/macos.md); Gatekeeper still needs
      # "Open Anyway" once, as without it.
      - name: Import the code-signing certificate
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no MACOS_SIGNING_P12 secret: ad-hoc signing"; exit 0; fi
          kc="$RUNNER_TEMP/sign.keychain-db"; kp=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cs.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cs.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/cs.p12" -passin env:P12_PASSWORD -nokeys -legacy -out "$RUNNER_TEMP/cs.pem" 2>/dev/null || openssl pkcs12 -in "$RUNNER_TEMP/cs.p12" -passin env:P12_PASSWORD -nokeys -out "$RUNNER_TEMP/cs.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cs.pem"
          rm -f "$RUNNER_TEMP/cs.p12"
          security find-identity -v -p codesigning "$kc"
          echo "APPLE_SIGNING_IDENTITY=Tether Code Signing" >> "$GITHUB_ENV"
          echo "EXPECT_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        env:
          # Optional: an Apple Developer ID identity (secret) instead of the certificate above.
          APPLE_SIGNING_IDENTITY_DEVID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY_DEVID" ]; then export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_DEVID"; fi
          bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tether-macos-universal
          path: dist/macos/*
      - name: Smoke test (window shown, no admin prompt)
        shell: bash
        run: bash scripts/smoke-macos.sh dist/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tether-macos-smoke
          path: dist/smoke/*
