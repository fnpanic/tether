name: desktop
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

env:
  TETHER_SERVER: ${{ secrets.TETHER_SERVER }}
  TETHER_PUB_KEY: ${{ secrets.TETHER_PUB_KEY }}
  TETHER_ADMIN_PUB_KEY: ${{ secrets.TETHER_ADMIN_PUB_KEY }}
  TETHER_UPDATER_PUB_KEY: ${{ secrets.TETHER_UPDATER_PUB_KEY }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc, triplet: x64-windows-static }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - name: Fetch pinned sources and apply patches
        shell: bash
        run: bash scripts/bootstrap.sh
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with: { vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d }
      - name: Native deps
        shell: bash
        env: { VCPKG_DEFAULT_HOST_TRIPLET: "${{ matrix.triplet }}" }
        run: |
          cd vendor/rustdesk
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.triplet }} --x-install-root="$VCPKG_ROOT/installed"
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: UI checks
        working-directory: apps/desktop
        run: npm ci && npx tsc --noEmit && npx vitest run
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: cargo test --target ${{ matrix.target }} security
      - name: Bundle
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tether-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # Unsigned universal build (Apple silicon + Intel), the same script as on a developer Mac.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/quick/src-tauri
      - name: Build
        shell: bash
        env:
          # Optional: an Apple Developer ID identity instead of ad-hoc signing.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tether-macos-universal
          path: dist/macos/*
