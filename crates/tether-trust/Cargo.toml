[package]
name = "tether-trust"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Signed policies, admin request signatures and version rules shared by Tether's apps and relay API"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
# Updater (Tauri minisign) signature check with the signed trusted comment (release.rs).
minisign-verify = "0.3"

[dev-dependencies]
minisign = "0.10"
