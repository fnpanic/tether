{{- if .Values.api.enabled }}
{{- $fn := include "tr.fullname" . -}}
{{- $ctx := dict "root" . "component" "api" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fn }}-api
  labels: {{- include "tr.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.api.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.api.persistence.size }} } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-files
  labels: {{- include "tr.labels" . | nindent 4 }}
data:
  # Same /download, /q and / handling as server/caddy/Caddyfile, reading tether-api's data volume.
  Caddyfile: |
    {
      admin off
      auto_https off
      # Keep the proxy pods' X-Forwarded-For (the client) for tether-api's per-IP limits.
      servers {
        trusted_proxies static private_ranges
      }
    }
    :8081 {
      # Custom-app links: tether-api checks the token and names a prepared file under /data
      # (X-Accel-Redirect); this Caddy sends it, so a slow download holds no tether-api worker.
      handle /q/* {
        reverse_proxy 127.0.0.1:21120 {
          header_up X-Tether-Accel 1
          @accel header X-Accel-Redirect *
          handle_response @accel {
            root * /data
            rewrite * {rp.header.X-Accel-Redirect}
            header Content-Type application/vnd.microsoft.portable-executable
            header Content-Disposition {rp.header.Content-Disposition}
            header Cache-Control no-store
            header X-Content-Type-Options nosniff
            file_server
          }
        }
      }
      handle /download/* {
        root * /data
        @manifest path */latest.json
        header @manifest Cache-Control "no-cache"
        file_server
      }
      handle / {
        root * /data/download
        @page file /index.html
        handle @page {
          rewrite * /index.html
          file_server
        }
        handle {
          respond "Tether relay" 200
        }
      }
      handle {
        respond "Tether relay" 200
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-api
  labels: {{- include "tr.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Flat files on a ReadWriteOnce volume: never two writers.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "tr.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tr.selector" $ctx | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext: { fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: {{ include "tr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tether-api", "--data", "/data", "--listen", "0.0.0.0:21120"]
          env:
            - { name: ADMIN_PUB_KEY, value: {{ .Values.api.adminPubKey | quote }} }
          ports:
            - { name: api, containerPort: 21120 }
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "tr.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /data }
        - name: files
          image: {{ .Values.proxy.image }}
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          env:
            - { name: XDG_DATA_HOME, value: /tmp/data }
            - { name: XDG_CONFIG_HOME, value: /tmp/config }
          ports:
            - { name: files, containerPort: 8081 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 500m, memory: 128Mi }
          {{- include "tr.caddySecurity" . | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
            - { name: files-config, mountPath: /etc/caddy }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: {{ $fn }}-api } }
        - { name: files-config, configMap: { name: {{ $fn }}-files } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-api
  labels: {{- include "tr.labels" . | nindent 4 }}
spec:
  selector: {{- include "tr.selector" $ctx | nindent 4 }}
  ports:
    - { name: api, port: 21120 }
    - { name: files, port: 8081 }
{{- end }}
