# Tether alert rules (docs/monitoring.md › Alerts). Tested by rules.test.yml (promtool test rules).
groups:
  - name: tether-availability
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }} is not reachable"
          description: "node_exporter on {{ $labels.node }} has not answered for 2 minutes (host down, or for the other node its Caddy /_metrics path)."
      - alert: TargetDown
        expr: up{job=~"hbbs|hbbr|api|caddy|nginx|blackbox_exporter|alertmanager"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} metrics on {{ $labels.node }} unreachable"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.node }} for 5 minutes: the service is down or does not expose metrics (old binary?)."
      - alert: ProbeFailed
        expr: probe_success == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.probe }} on {{ $labels.node }} fails from {{ $labels.probe_from }}"
          description: "{{ $labels.instance }} has failed for 3 minutes, probed from {{ $labels.probe_from }}."
      - alert: RelayUnhealthy
        expr: hbbs_relay_healthy == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "relay {{ $labels.relay }} unhealthy (seen by hbbs on {{ $labels.node }})"
          description: "The {{ $labels.role }} relay {{ $labels.relay }} has failed hbbs's 3 s health check for a minute; hbbs does not hand it out."
      - alert: RelayFailover
        expr: hbbs_relay_failover == 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "hbbs on {{ $labels.node }} hands out backup relays"
          description: "No primary relay is healthy: new sessions go over the backup relay."
      - alert: ServiceUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.node }}"
          description: "systemd reports {{ $labels.name }} as failed."
      - alert: ServiceRestarting
        expr: changes(process_start_time_seconds{job=~"hbbs|hbbr|api"}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.node }} restarted {{ $value }} times in 15 minutes"
          description: "A crash loop or repeated restarts."

  - name: tether-capacity
    rules:
      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "TLS certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "Caddy renews 30 days ahead: renewal has failed for over two weeks. Check tether-https logs (TLS-ALPN-01 on 443)."
      - alert: DiskAlmostFull
        expr: |
          1 - node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|efivarfs|vfat",mountpoint!~"/boot.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|efivarfs|vfat",mountpoint!~"/boot.*"} > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
          description: "Over 85 % used. tether-api refuses uploads below 2 GiB free; Prometheus keeps 30 days."
      - alert: HighCpu
        expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "CPU on {{ $labels.node }} is {{ $value | humanizePercentage }} busy"
          description: "Over 90 % for 15 minutes."
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} has {{ $value | humanizePercentage }} memory available"
          description: "Under 10 % available for 10 minutes."
      - alert: ConntrackAlmostFull
        expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "conntrack table on {{ $labels.node }} {{ $value | humanizePercentage }} full"
          description: "New connections are dropped when it is full."
      - alert: HbbrSaturated
        expr: |
          sum by (node) (hbbr_sessions) > 150
            or max by (node) (process_open_fds{job="hbbr"} / process_max_fds{job="hbbr"}) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "hbbr on {{ $labels.node }} near its limit ({{ $value }})"
          description: "Over 150 relayed sessions (tune to the node's bandwidth: a CX23 has ~1 Gbit/s shared) or over 80 % of its file descriptors."
      - alert: TurnAllocationsNearCap
        expr: hbbs_turn_allocations / hbbs_turn_allocations_max > 0.8 and hbbs_turn_allocations_max > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "TURN on {{ $labels.node }} at {{ $value | humanizePercentage }} of TURN_MAX_ALLOCATIONS"
          description: "New WebRTC sessions fall back to the relay once the cap is reached."

  # Scale-out warnings (docs/scaling.md "Headroom and alerts"): fire while there is still room,
  # i.e. when losing the largest location (3 of 8 nodes: the rest carries 8/5 = 1.6x) would push a
  # node over the 65 % planning limit: 0.65 / 1.6 = 0.40 of NIC, CPU or memory.
  - name: tether-headroom
    rules:
      - alert: CapacityEgress
        expr: |
          max by (node) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|br-.*|wg.*"}[10m])
            / (node_network_speed_bytes > 0)) > 0.40
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} sends {{ $value | humanizePercentage }} of its port"
          description: "Over 40 % for 15 minutes: after a location failure the remaining relays would run above 65 %. Add a relay node (docs/scaling.md)."
      - alert: CapacityCpu
        expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[10m])) > 0.40
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "CPU on {{ $labels.node }} {{ $value | humanizePercentage }} busy"
          description: "Over 40 % for 30 minutes: no headroom left for a failover (x1.6). Add a node (docs/scaling.md)."
      - alert: CapacityMemory
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.40
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} uses {{ $value | humanizePercentage }} of its memory"
          description: "Over 40 % for 30 minutes: a reconnect burst (2x WebSockets) or a failover would not fit under 65 %."
      - alert: CapacitySignalling
        expr: sum by (node) (hbbs_connections{transport="ws"}) > 15000
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} holds {{ $value }} WebSockets"
          description: "Every front holds every device. The plan is 10 000 devices with 2x burst room per front (docs/scaling.md): more than 15 000 means the device count has outgrown it."
      - alert: ListenQueueOverflow
        expr: increase(node_netstat_TcpExt_ListenOverflows[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} dropped {{ $value }} incoming connections (listen queue full)"
          description: "A reconnect storm overflowed a listen backlog: check somaxconn (sysctl 90-tether.conf) and the front end's backlog."

  - name: tether-api
    rules:
      - alert: ApiErrors
        expr: |
          sum by (node) (rate(tether_api_requests_total{code=~"5.."}[5m]))
            / sum by (node) (rate(tether_api_requests_total[5m])) > 0.05
          and sum by (node) (rate(tether_api_requests_total{code=~"5.."}[5m])) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "tether-api on {{ $labels.node }}: {{ $value | humanizePercentage }} of requests fail with 5xx"
          description: "Check journalctl -u tether-api (500 internal, 503 busy or admin disabled, 507 storage)."
      - alert: ApiWorkersExhausted
        expr: increase(tether_api_busy_rejected_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "tether-api on {{ $labels.node }} answered 503 busy"
          description: "All 32 workers were busy: slow clients or a flood."

  - name: tether-releases
    rules:
      - alert: ReleaseGenerationMismatch
        expr: max by (node) (tether_api_release_generation) != max by (node) (hbbs_release_generation)
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: hbbs does not push the current release generation"
          description: "tether-api is at another release generation than hbbs for 2 minutes: the push hint is broken (hbbs cannot read /var/lib/tether-api/release-generation: group tether-api, restart hbbs). Devices still learn of releases from the heartbeat within 15 minutes."
      - alert: ReleaseIndexMismatch
        expr: max by (channel) (tether_api_release_index_serial) != min by (channel) (tether_api_release_index_serial)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The release index of channel {{ $labels.channel }} differs between relays"
          description: "Not every relay has the newest signed release index for 10 minutes: a publish did not reach every relay. Tether Manage › Releases › Publish to missing relays."
      - alert: ReleaseIndexExpiringSoon
        # Tether's releases.json only: monitor.json (index="monitor") is refreshed with monitor-publish (docs/health.md).
        expr: min by (channel) (tether_api_release_index_expires_timestamp{index=""}) - time() < 7 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The release index of channel {{ $labels.channel }} expires in {{ $value | humanizeDuration }}"
          description: "After expiry devices show \"update information is out of date\" (they keep working). Unlock the keys in Tether Manage: it re-signs indexes that expire within 15 days."
      - alert: UpdateFailuresHigh
        expr: sum(tether_api_devices_update_state{state="failed"}) / clamp_min(sum(tether_api_devices_update_state), 1) > 0.02
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of active devices report a failed update"
          description: "Downloads or verification fail on many devices: a bad upload (sha256 or signature), a blocked CDN without relay fallback, or 503s from the download cap. Consider halting the rollout (Tether Manage › Releases › Rollouts)."
      - alert: UpdateStale
        expr: sum(tether_api_devices_update_state{state="stale"}) > 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "{{ $value }} devices hold an expired release index"
          description: "They cannot reach a fresh signed index (relays serve an old one, or none was re-signed). Unlock the keys in Tether Manage."

  - name: tether-meta
    rules:
      # Always firing: the end-to-end check of Prometheus -> Alertmanager (and of an optional
      # dead man's switch outside, docs/monitoring.md).
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Alerting pipeline works"
