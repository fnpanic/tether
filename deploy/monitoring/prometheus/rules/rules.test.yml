# promtool test rules deploy/monitoring/prometheus/rules/rules.test.yml
rule_files: [tether.yml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'up{job="node",node="tether-desk2"}'
        values: '1 1 0 0 0 0 0 0'
      - series: 'hbbs_relay_failover{job="hbbs",node="tether-desk2"}'
        values: '0 0 1 1 1 1 1 1'
      - series: 'hbbs_relay_healthy{job="hbbs",node="tether-desk2",relay="tether-desk.duckdns.org",role="primary"}'
        values: '1 1 0 0 0 0 0 0'
      - series: 'probe_ssl_earliest_cert_expiry{job="probe",node="tether-desk",instance="https://tether-desk.duckdns.org/readyz/relay"}'
        values: '864000x40'
      - series: 'node_filesystem_avail_bytes{job="node",node="tether-desk",mountpoint="/",fstype="xfs"}'
        values: '10x40'
      - series: 'node_filesystem_size_bytes{job="node",node="tether-desk",mountpoint="/",fstype="xfs"}'
        values: '100x40'
      - series: 'tether_api_requests_total{job="api",node="tether-desk",endpoint="heartbeat",code="204"}'
        values: '0+10x40'
      - series: 'tether_api_requests_total{job="api",node="tether-desk",endpoint="heartbeat",code="500"}'
        values: '0+10x40'
      - series: 'hbbr_sessions{job="hbbr",node="tether-desk",transport="ws"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: NodeDown
        exp_alerts:
          - exp_labels: { severity: critical, job: node, node: tether-desk2 }
            exp_annotations:
              summary: "tether-desk2 is not reachable"
              description: "node_exporter on tether-desk2 has not answered for 2 minutes (host down, or for the other node its Caddy /_metrics path)."
      - eval_time: 1m
        alertname: NodeDown
        exp_alerts: []
      - eval_time: 2m
        alertname: RelayFailover
        exp_alerts:
          - exp_labels: { severity: critical, job: hbbs, node: tether-desk2 }
            exp_annotations:
              summary: "hbbs on tether-desk2 hands out backup relays"
              description: "No primary relay is healthy: new sessions go over the backup relay."
      - eval_time: 3m
        alertname: RelayUnhealthy
        exp_alerts:
          - exp_labels: { severity: critical, job: hbbs, node: tether-desk2, relay: tether-desk.duckdns.org, role: primary }
            exp_annotations:
              summary: "relay tether-desk.duckdns.org unhealthy (seen by hbbs on tether-desk2)"
              description: "The primary relay tether-desk.duckdns.org has failed hbbs's 3 s health check for a minute; hbbs does not hand it out."
      - eval_time: 20m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels: { severity: warning, job: node, node: tether-desk, mountpoint: /, fstype: xfs }
            exp_annotations:
              summary: "/ on tether-desk is 90% full"
              description: "Over 85 % used. tether-api refuses uploads below 2 GiB free; Prometheus keeps 30 days."
      - eval_time: 15m
        alertname: ApiErrors
        exp_alerts:
          - exp_labels: { severity: warning, node: tether-desk }
            exp_annotations:
              summary: "tether-api on tether-desk: 50% of requests fail with 5xx"
              description: "Check journalctl -u tether-api (500 internal, 503 busy or admin disabled, 507 storage)."
      - eval_time: 15m
        alertname: HbbrSaturated
        exp_alerts:
          - exp_labels: { severity: warning, node: tether-desk }
            exp_annotations:
              summary: "hbbr on tether-desk near its limit (200)"
              description: "Over 150 relayed sessions (tune to the node's bandwidth: a CX23 has ~1 Gbit/s shared) or over 80 % of its file descriptors."
      - eval_time: 15m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: { severity: warning, job: probe, node: tether-desk, instance: "https://tether-desk.duckdns.org/readyz/relay" }
            exp_annotations:
              summary: "TLS certificate of https://tether-desk.duckdns.org/readyz/relay expires in 9d 23h 45m 0s"
              description: "Caddy renews 30 days ahead: renewal has failed for over two weeks. Check tether-https logs (TLS-ALPN-01 on 443)."
  - interval: 1m
    input_series:
      - series: 'node_network_transmit_bytes_total{job="node",node="relay3",device="eth0"}'
        values: '0+3750000000x40'
      - series: 'node_network_speed_bytes{job="node",node="relay3",device="eth0"}'
        values: '125000000x40'
      - series: 'hbbs_connections{job="hbbs",node="tether-desk",transport="ws"}'
        values: '16000x40'
      - series: 'node_netstat_TcpExt_ListenOverflows{job="node",node="tether-desk"}'
        values: '0 0 0 0 0 120 120 120 120 120'
    alert_rule_test:
      - eval_time: 30m
        alertname: CapacityEgress
        exp_alerts:
          - exp_labels: { severity: warning, node: relay3 }
            exp_annotations:
              summary: "relay3 sends 50% of its port"
              description: "Over 40 % for 15 minutes: after a location failure the remaining relays would run above 65 %. Add a relay node (docs/scaling.md)."
      - eval_time: 35m
        alertname: CapacitySignalling
        exp_alerts:
          - exp_labels: { severity: warning, node: tether-desk }
            exp_annotations:
              summary: "tether-desk holds 16000 WebSockets"
              description: "Every front holds every device. The plan is 10 000 devices with 2x burst room per front (docs/scaling.md): more than 15 000 means the device count has outgrown it."
      - eval_time: 6m
        alertname: ListenQueueOverflow
        exp_alerts:
          - exp_labels: { severity: warning, job: node, node: tether-desk }
            exp_annotations:
              summary: "tether-desk dropped 120 incoming connections (listen queue full)"
              description: "A reconnect storm overflowed a listen backlog: check somaxconn (sysctl 90-tether.conf) and the front end's backlog."
  - interval: 1m
    input_series:
      - series: 'tether_api_release_generation{job="api",node="tether-desk"}'
        values: '5x20'
      - series: 'hbbs_release_generation{job="hbbs",node="tether-desk"}'
        values: '4x20'
      - series: 'tether_api_release_generation{job="api",node="tether-desk2"}'
        values: '5x20'
      - series: 'hbbs_release_generation{job="hbbs",node="tether-desk2"}'
        values: '5x20'
      - series: 'tether_api_release_index_serial{job="api",node="tether-desk",channel="stable"}'
        values: '7x20'
      - series: 'tether_api_release_index_serial{job="api",node="tether-desk2",channel="stable"}'
        values: '6x20'
      - series: 'tether_api_devices_update_state{job="api",node="tether-desk",state="failed"}'
        values: '5x40'
      - series: 'tether_api_devices_update_state{job="api",node="tether-desk",state="idle"}'
        values: '95x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: ReleaseGenerationMismatch
        exp_alerts:
          - exp_labels: { severity: warning, node: tether-desk }
            exp_annotations:
              summary: "tether-desk: hbbs does not push the current release generation"
              description: "tether-api is at another release generation than hbbs for 2 minutes: the push hint is broken (hbbs cannot read /var/lib/tether-api/release-generation: group tether-api, restart hbbs). Devices still learn of releases from the heartbeat within 15 minutes."
      - eval_time: 5m
        alertname: ReleaseIndexMismatch
        exp_alerts: []
      - eval_time: 11m
        alertname: ReleaseIndexMismatch
        exp_alerts:
          - exp_labels: { severity: warning, channel: stable }
            exp_annotations:
              summary: "The release index of channel stable differs between relays"
              description: "Not every relay has the newest signed release index for 10 minutes: a publish did not reach every relay. Tether Manage › Releases › Publish to missing relays."
      - eval_time: 31m
        alertname: UpdateFailuresHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "5% of active devices report a failed update"
              description: "Downloads or verification fail on many devices: a bad upload (sha256 or signature), a blocked CDN without relay fallback, or 503s from the download cap. Consider halting the rollout (Tether Manage › Releases › Rollouts)."
