# Installed as /etc/tether/nginx.d/grafana.conf on the monitoring node when the front is nginx
# (install.sh monitor). Grafana at https://<this host>/grafana/: nginx's password first (any IP),
# then Grafana's own login. nginx's Authorization header is not passed on.
location = /grafana {
	return 308 /grafana/;
}
location /grafana/ {
	auth_basic "Tether monitoring";
	auth_basic_user_file /etc/tether/nginx.d/grafana.htpasswd;
	proxy_pass http://127.0.0.1:3000;
	# A proxy_set_header here replaces the server's set: repeat it, then drop Authorization.
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_set_header Authorization "";
}
