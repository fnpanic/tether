# Installed as /etc/tether/nginx.d/metrics-remote.conf on a node that the Prometheus on the OTHER
# node scrapes, when the front is nginx (install.sh target). /_metrics/<job> answers only
# @SCRAPE_FROM@ (the monitoring node), and only with the scrape password; every other client gets
# 403 before the password is even checked. allow/deny and auth_basic are inherited by the nested
# locations (an `if` would not be).
location /_metrics/ {
	allow @SCRAPE_FROM@;
	deny all;
	auth_basic "Tether metrics";
	auth_basic_user_file /etc/tether/nginx.d/metrics.htpasswd;
	location = /_metrics/hbbs { proxy_pass http://127.0.0.1:21123/metrics; }
	location = /_metrics/hbbr { proxy_pass http://127.0.0.1:21124/metrics; }
	location = /_metrics/api { proxy_pass http://127.0.0.1:21120/metrics; }
	location = /_metrics/nginx { proxy_pass http://127.0.0.1:21125/metrics; }
	location = /_metrics/node { proxy_pass http://127.0.0.1:9100/metrics; }
	# blackbox_exporter: ?module=...&target=... from prometheus.yml (probes of the other node).
	location = /_metrics/probe { proxy_pass http://127.0.0.1:9115/probe; }
	location /_metrics/ { return 404; }
}
