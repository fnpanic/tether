# Tether relay node kernel settings (docs/scaling.md "Kernel and limits"). install.sh copies this
# to /etc/sysctl.d/ and applies it.

# Connection tracking (firewalld/nftables track every flow, loopback included): each WebSocket
# through Caddy is two tracked connections (client side, upstream to hbbs/hbbr), plus TURN/STUN
# flows. 10 000 hosts and 3 000 relayed sessions on one node are ~35 000 entries; the default
# limit on a 4 GB VM is 65 536 (higher on more RAM). Entries cost ~320 bytes and are allocated on use.
net.netfilter.nf_conntrack_max = 524288

# Accept queues for reconnect storms (a Caddy restart reconnects every client within seconds).
# hbbs/hbbr ask for 128, Caddy for the system maximum.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192

# UDP receive buffer up to 8 MiB for hbbs's single UDP socket (registrations, STUN, TURN media;
# tether-hbbs.service passes -M 8388608). The default 208 KiB is a few ms of TURN traffic.
net.core.rmem_max = 8388608

# BBR + fq on the relay's own sockets: better throughput to lossy client paths (docs/stun-turn.md).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# The service ports must never be handed out as ephemeral source ports (Caddy dials hbbs, hbbr
# and tether-api on loopback; a restarted service could not bind its port otherwise).
net.ipv4.ip_local_reserved_ports = 21114-21125
