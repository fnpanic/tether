[package]
name = "tether-api"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tether relay API: signed policy, heartbeat, diagnostics and release hosting (see docs/api.md)"

[dependencies]
tether-trust = { path = "../../crates/tether-trust" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
libc = "0.2"
# Already in the tree through tether-trust; hashes the status summary while it is written.
sha2 = "0.10"
# gzip copy of the team summary (written once per rebuild): pure-Rust deflate (miniz_oxide), no C code.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# Test-only settings (`TETHER_TEST_*`) in a release build, for scripts/test-relay.sh. Debug builds
# have them anyway; a production build (`cargo build --release`, scripts/build-relay.sh) never.
test-hooks = []

[profile.release]
lto = true
codegen-units = 1
strip = true

# tiny_http with a bounded body drain (patched/tiny_http/src/util/equal_reader.rs), a read
# timeout on accepted connections (src/lib.rs), `Connection: close` let through (src/response.rs)
# and no connection left in the thread pool's queue (src/util/task_pool.rs).
[patch.crates-io]
tiny_http = { path = "patched/tiny_http" }
