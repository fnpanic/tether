# tiny_http 0.12.0 from crates.io (MIT OR Apache-2.0), unchanged except src/util/equal_reader.rs
# (Drop: bounded drain, see there); dev-dependencies and readme dropped. Used through
# [patch.crates-io] in ../../Cargo.toml.
[package]
edition = "2018"
name = "tiny_http"
version = "0.12.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"

[dependencies]
ascii = "1.0"
chunked_transfer = "1"
httpdate = "1.0.2"
log = "0.4.4"
openssl = { version = "0.10", optional = true }
rustls = { version = "0.20", optional = true }
rustls-pemfile = { version = "0.2.1", optional = true }
zeroize = { version = "1", optional = true }

[features]
default = []
ssl = ["ssl-openssl"]
ssl-openssl = ["openssl", "zeroize"]
ssl-rustls = ["rustls", "rustls-pemfile", "zeroize"]

# Upstream warnings, not ours.
[lints.rust]
unused_imports = "allow"
dead_code = "allow"
