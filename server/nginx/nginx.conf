# Tether relay front end, nginx variant (server/install.sh with PROXY=nginx; Caddy stays the
# default). The same routes as server/caddy/Caddyfile: everything clients need over TCP 443 (TLS +
# WebSocket). install.sh renders it to /etc/tether/nginx.conf with @RELAY_HOST@ and @RESOLVER@
# filled in. Why nginx and the numbers behind it: docs/proxy-benchmark.md.
# nginx and the ACME module come from nginx.org's signed mainline repository (dnf updates them).
load_module modules/ngx_http_acme_module.so;

# nginx runs as tether-https (systemd unit), where this line is ignored with a warning; it matters
# for `nginx -t` run as root (install.sh), which would otherwise hand the temp dirs to nobody.
user tether-https tether-https;
worker_processes auto;
worker_rlimit_nofile 1048576;
# Graceful reload (systemctl reload tether-https): old workers keep their WebSockets (relay
# sessions included) for up to an hour, then close what is left; clients reconnect in seconds.
worker_shutdown_timeout 1h;
pid /run/tether-https/nginx.pid;
error_log stderr warn;

events {
	# Per worker; each proxied WebSocket takes two (client + upstream).
	worker_connections 65536;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	server_tokens off;
	# No access log: /q/ tokens are secrets (as with Caddy).
	access_log off;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 75s;

	# Request bodies (/api/*) are read whole by nginx before tether-api sees them: up to 512 KiB in
	# memory, the rest in a temp file, so a slow client waits here, not in one of tether-api's
	# workers. tether-api enforces its own size limits.
	client_body_buffer_size 512k;
	client_max_body_size 0;
	client_body_temp_path /var/lib/tether-https/nginx/body;
	proxy_temp_path /var/lib/tether-https/nginx/proxy;
	fastcgi_temp_path /var/lib/tether-https/nginx/fastcgi;
	uwsgi_temp_path /var/lib/tether-https/nginx/uwsgi;
	scgi_temp_path /var/lib/tether-https/nginx/scgi;

	# Mozilla "intermediate": TLS 1.2 + 1.3, AEAD ciphers only.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:TLS:20m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;
	# 4 KB TLS records instead of 16 KB: 5 KB less per idle WebSocket, same relay CPU (benchmark).
	ssl_buffer_size 4k;

	# Let's Encrypt via TLS-ALPN-01 on 443 (no port 80 needed, as with Caddy); the account key and
	# certificate survive restarts in state_path. Renewal runs inside nginx, no reload.
	resolver @RESOLVER@ ipv6=off;
	acme_issuer letsencrypt {
		uri https://acme-v02.api.letsencrypt.org/directory;
		challenge tls-alpn-01;
		state_path /var/lib/tether-https/acme;
		accept_terms_of_service;
	}
	acme_shared_zone zone=acme:1M;

	# Release and custom-app downloads share one budget per node: at most 32 at a time at 512 KB/s
	# each (128 Mbit/s, ~13 % of a 1 Gbit/s port), so a release day cannot starve the relayed
	# sessions; more parallel downloads get 503 and the updaters retry on their next check
	# (docs/scaling.md "Downloads"). Large rollouts belong on object storage / a CDN (latest.json
	# may point anywhere; the files are signed).
	limit_conn_zone $server_name zone=downloads:1m;
	limit_conn_status 503;

	# WebSocket upgrades pass through; for everything else Connection is empty (upstream keep-alive).
	map $http_upgrade $connection_upgrade {
		default upgrade;
		"" "";
	}
	# tether-api answers /q/ with X-Accel-Redirect only when the proxy says it can follow it.
	map $uri $tether_accel {
		~^/q/ 1;
		default "";
	}

	upstream tether_api {
		server 127.0.0.1:21120;
		keepalive 16;
	}

	# Plain HTTP on 80 (when the firewall does not forward 80 to 443): redirect.
	server {
		listen 80 default_server;
		listen [::]:80 default_server;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl reuseport backlog=8192 default_server;
		listen [::]:443 ssl reuseport backlog=8192 default_server;
		http2 on;
		server_name @RELAY_HOST@;
		acme_certificate letsencrypt;
		ssl_certificate $acme_certificate;
		ssl_certificate_key $acme_certificate_key;
		ssl_certificate_cache max=4;

		# add_header in a location replaces these: locations that add headers repeat HSTS.
		add_header Strict-Transport-Security "max-age=31536000" always;

		proxy_http_version 1.1;
		# The client IP the services use: hbbs takes the last X-Forwarded-For hop, hbbr X-Real-IP,
		# tether-api the first. All are overwritten with the peer nginx saw, so a client-sent value
		# never reaches them. Keep every proxy_set_header here: one inside a location would drop
		# all of these for it (nginx inherits them only when a level sets none).
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header X-Tether-Accel $tether_accel;

		# Rendezvous (hbbs) and relay (hbbr) WebSocket endpoints. Only nginx can reach these ports.
		location = /ws/id {
			proxy_pass http://127.0.0.1:21118;
			proxy_buffering off;
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
		}
		location = /ws/relay {
			proxy_pass http://127.0.0.1:21119;
			proxy_buffering off;
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
		}

		# Relay readiness for the other relays' hbbs (HA, docs/relay-ha.md).
		location = /readyz/relay {
			proxy_pass http://127.0.0.1:21121/readyz;
		}
		# Public key hbbs signs with (docs/key-rotation.md).
		location = /rendezvous/pubkey {
			proxy_pass http://127.0.0.1:21122/pubkey;
		}

		# Relay API (tether-api).
		location /api/ {
			proxy_pass http://tether_api;
		}

		# Private custom-app download links (GET /q/<token>, docs/api.md "Custom apps"). tether-api
		# checks the token and answers X-Accel-Redirect: /qcache/<file>; nginx sends that file, so a
		# slow download does not hold one of tether-api's workers.
		location /q/ {
			proxy_pass http://tether_api;
		}
		# Only reachable through X-Accel-Redirect: a request for /qcache/... gets 404.
		location /qcache/ {
			internal;
			root /var/lib/tether-api;
			types { application/zip zip; } # the macOS custom app; everything else is the exe
			default_type application/vnd.microsoft.portable-executable;
			add_header Cache-Control no-store always;
			add_header X-Content-Type-Options nosniff always;
			add_header Strict-Transport-Security "max-age=31536000" always;
			limit_conn downloads 32;
			limit_rate_after 1m;
			limit_rate 512k;
		}

		# Release downloads and update manifests written by tether-api (nginx, user tether-https,
		# reads them through membership in group tether-api; see install.sh).
		location /download/ {
			root /var/lib/tether-api;
			# TetherQS-<v>.exe.gz beside the exe (Tether Manage uploads it): sent gzip-encoded to
			# clients that accept it, 35 -> 15 MB (docs/update-design.md).
			gzip_static on;
			limit_conn downloads 32;
			limit_rate_after 1m;
			limit_rate 512k;
		}
		# The signed release index: tether-api serves it with ETag "<serial>" (equal on every relay,
		# so If-None-Match works across relays) and counts the fetches. Never limited.
		location ~ ^/download/[a-z0-9-]+/releases\.json$ {
			proxy_pass http://tether_api;
		}
		# Update manifests: never cached, never limited (a regex location wins over /download/).
		location ~ ^/download/.+/latest\.json$ {
			root /var/lib/tether-api;
			add_header Cache-Control no-cache always;
			add_header Strict-Transport-Security "max-age=31536000" always;
		}

		# Download page, if one was published; otherwise the plain marker text.
		location = / {
			root /var/lib/tether-api/download;
			try_files /index.html @marker;
		}
		location @marker {
			default_type text/plain;
			return 200 "Tether relay";
		}
		location / {
			default_type text/plain;
			return 200 "Tether relay";
		}

		# Optional extras from the monitoring installer (deploy/monitoring/install.sh): /_metrics/*
		# for the Prometheus on the other node, /grafana/ on the monitoring node. None by default.
		include /etc/tether/nginx.d/*.conf;
	}

	# Connection counters for nginx-prometheus-exporter (tether-nginx-exporter.service), which
	# serves them as Prometheus metrics on 127.0.0.1:21125 (where Caddy's metrics would be).
	server {
		listen 127.0.0.1:21126;
		location = /stub_status {
			stub_status;
		}
		location / {
			return 404;
		}
	}
}
