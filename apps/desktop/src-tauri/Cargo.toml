[package]
name = "tether"
version = "0.6.3"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tether remote desktop"

[[bin]]
name = "tether"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rdev = { git = "https://github.com/rustdesk-org/rdev" }
librustdesk = { package = "rustdesk", path = "../../../vendor/rustdesk", default-features = false, features = ["tauri", "hwcodec", "use_dasp"] }
hbb_common = { path = "../../../vendor/rustdesk/libs/hbb_common" }
base = { path = "../../../vendor/rustdesk/libs/base" }
tether-trust = { path = "../../../crates/tether-trust" }
tauri-plugin-updater = "2.14"
tauri-plugin-deep-link = "2"
# Same version and features as librustdesk, so no second build.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "socks", "json", "native-tls", "rustls-tls", "rustls-tls-native-roots", "gzip", "zstd"] }
# Already in the tree (reqwest gzip): unpacks the gzip copy of a release (CDN).
flate2 = "1"
lzma-rs = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
url = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# Staff sign-in (oidc.rs): PKCE values; all three already in the tree.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# The sign-in's refresh token in the OS credential store (Windows Credential Manager, macOS Keychain).
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder file copy-paste with Windows peers (cliprdr): the core's macOS pasteboard code (libs/clipboard/src/platform/unix/macos).
librustdesk = { package = "rustdesk", path = "../../../vendor/rustdesk", default-features = false, features = ["unix-file-copy-paste"] }

[target.'cfg(windows)'.dependencies]
# VRAM (D3D11) zero-copy encoding exists on Windows only (hwcodec's ffmpeg_vram is D3D11 code).
librustdesk = { package = "rustdesk", path = "../../../vendor/rustdesk", default-features = false, features = ["vram"] }
# Health notifications (already in the tree through vendor/rustdesk).
tauri-winrt-notification = "0.1"
windows-sys = { version = "0.59", features = ["Win32_UI_HiDpi", "Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Registry", "Win32_System_Console", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
# Signs test artifacts in the health agent manager's tests (as in tether-trust's own tests).
minisign = "0.10"
# The mock OpenID provider for the sign-in tests (oidc.rs).
oidc-mock = { path = "../../../tools/oidc-mock" }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep in sync with vendor/rustdesk/Cargo.toml: patches only apply at the workspace root.
[patch.crates-io]
# The relay's tiny_http, as tools/oidc-mock uses it (a dev-dependency only).
tiny_http = { path = "../../../server/api/patched/tiny_http" }
libxdo-sys = { path = "../../../vendor/rustdesk/libs/libxdo-sys-stub" }
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }
webrtc = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }
webrtc-util = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }
webrtc-sctp = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

# RSA key generation in the mock OpenID provider (tests) takes seconds unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[workspace]

# Tether Manage includes src/oidc.rs with this cfg set (apps/manage/src-tauri/build.rs).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tether_manage)'] }

# Optimized build that keeps debug-only test hooks (TETHER_DEV_PASSWORD) for benchmarks.
[profile.profiling]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16

# Tether: our copy of the fork's SCTP (crates/webrtc-sctp, RACK loss detection, 40 ms RTO floor).
[patch."https://github.com/rustdesk-org/webrtc"]
webrtc-sctp = { path = "../../../crates/webrtc-sctp" }
