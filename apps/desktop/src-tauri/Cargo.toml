[package]
name = "tether"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tether remote desktop"

[[bin]]
name = "tether"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rdev = { git = "https://github.com/rustdesk-org/rdev" }
librustdesk = { package = "rustdesk", path = "../../../vendor/rustdesk", default-features = false, features = ["tauri", "hwcodec", "vram", "use_dasp"] }
hbb_common = { path = "../../../vendor/rustdesk/libs/hbb_common" }
base = { path = "../../../vendor/rustdesk/libs/base" }
tether-trust = { path = "../../../crates/tether-trust" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_HiDpi", "Win32_Foundation", "Win32_Networking_WinHttp"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep in sync with vendor/rustdesk/Cargo.toml: patches only apply at the workspace root.
[patch.crates-io]
libxdo-sys = { path = "../../../vendor/rustdesk/libs/libxdo-sys-stub" }
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }
webrtc = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }
webrtc-util = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }
webrtc-sctp = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

[workspace]

# Optimized build that keeps debug-only test hooks (TETHER_DEV_PASSWORD) for benchmarks.
[profile.profiling]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
