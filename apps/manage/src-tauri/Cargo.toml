[package]
name = "tether-manage"
version = "0.5.5"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tether Manage: keys, policy, releases and diagnostics for a Tether relay"

[[bin]]
name = "tether-manage"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tether-trust = { path = "../../../crates/tether-trust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Same major as tauri-cli, so signatures match `tauri signer sign` byte for byte in format.
minisign = "0.9"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "stream"] }
# Already in the tree via reqwest; streams release uploads for the progress bar.
futures-util = { version = "0.3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Already in the tree (0.61 via tauri); the private server key file gets a user-only DACL.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# What tauri-plugin-updater 2.x verifies with.
minisign-verify = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Key unlock runs argon2id with 64 MiB; unoptimised it takes many seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
